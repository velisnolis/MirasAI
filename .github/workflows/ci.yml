name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  local-contracts:
    name: Local contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Run local contract checks
        run: bash docker/test-local-contracts.sh
